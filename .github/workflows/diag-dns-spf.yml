name: Diagnostic temporaire - DNS SPF/DKIM/DMARC des domaines mail

on:
  workflow_dispatch:

permissions:
  checks: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger les enregistrements DNS liés à l'envoi de mail
        run: |
          {
            for DOMAINE in focalclub.fr myfocal.online; do
              echo "=== $DOMAINE ==="
              echo "--- TXT (racine, dont SPF) ---"
              dig +short TXT "$DOMAINE"
              echo "--- MX ---"
              dig +short MX "$DOMAINE"
              echo "--- DMARC (_dmarc.$DOMAINE) ---"
              dig +short TXT "_dmarc.$DOMAINE"
              echo "--- DKIM sélecteurs courants ---"
              for SEL in default hostinger mail hpanel selector1 selector2 k1 dkim; do
                RES=$(dig +short TXT "${SEL}._domainkey.$DOMAINE")
                if [ -n "$RES" ]; then
                  echo "$SEL._domainkey.$DOMAINE -> $RES"
                fi
              done
              echo ""
            done
          } > /tmp/resultat-dns.txt 2>&1
          cat /tmp/resultat-dns.txt

      - name: Publier le résultat comme check run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENU=$(cat /tmp/resultat-dns.txt | head -c 60000)
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/check-runs \
            -d "$(jq -n --arg sha "${{ github.sha }}" --arg text "$CONTENU" \
              '{name: "resultat-dns-spf", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "Résultat diagnostic DNS", summary: "voir texte", text: $text}}')" \
            -w "\nHTTP %{http_code}\n"
