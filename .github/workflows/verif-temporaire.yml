name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Etat de l'espace apres creation de la base
        shell: bash
        run: |
          set +e
          B=https://myfocal.online

          echo "=== ETAPE DE MISE EN SERVICE ==="
          curl -s --max-time 25 -o /tmp/i -w '  installation.php -> HTTP %{http_code}\n' "$B/espace/installation.php"
          echo "  --- titre et messages reperes ---"
          grep -oE '<h1[^>]*>[^<]*' /tmp/i | sed 's/<h1[^>]*>/     titre : /' | head -2
          grep -oE 'Configuration absente|Base de donn[^<]*|d&eacute;j&agrave; install|déjà install|name="identifiant"|Installation de l' /tmp/i | head -4 | sed 's/^/     /'

          echo "  --- VERDICT ---"
          if   grep -q "Configuration absente"          /tmp/i; then
            echo "     >>> config.local.php N'EXISTE PAS encore (etape 2 a faire)"
          elif grep -q "Base de donn"                   /tmp/i; then
            echo "     >>> config.local.php existe mais MySQL REFUSE les identifiants"
          elif grep -q "déjà install\|d&eacute;j&agrave; install" /tmp/i; then
            echo "     >>> DEJA INSTALLE : un compte existe, l'espace est operationnel"
          elif grep -q 'name="identifiant"'             /tmp/i; then
            echo "     >>> PRET : la base repond, le formulaire d'installation s'affiche"
          else
            echo "     >>> etat non reconnu, extrait ci-dessous"
            sed -n 's/.*<main[^>]*>//p' /tmp/i | head -c 400
          fi

          echo "=== La page de connexion repond-elle ? ==="
          curl -s --max-time 25 -o /tmp/c -w '  connexion.php -> HTTP %{http_code}\n' "$B/espace/connexion.php"
          grep -oE '<title>[^<]*|name="identifiant"' /tmp/c | head -2 | sed 's/^/     /'

          echo "=== Protections (doivent rester 403) ==="
          for u in /espace/inc/config.local.php /espace/inc/schema.sql /espace/photos/ /espace/fichiers/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$B$u")
            case "$c" in 403|404) v="OK";; *) v="!!! A VERIFIER !!!";; esac
            printf "  %-34s -> %s  %s\n" "$u" "$c" "$v"
          done

          echo "=== Le mot de passe de la base fuit-il ? (controle de securite) ==="
          curl -s --max-time 25 "$B/espace/inc/config.local.php" | grep -qiE "mot_de_passe|u9122|localhost" \
            && echo "  !!! ALERTE : contenu de config.local.php servi en clair" \
            || echo "  OK : aucun contenu de configuration servi"
          exit 0
