name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Le site repond-il encore
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'

          echo "=== DNS ==="
          dig +short myfocal.online A | sed 's/^/  /'

          echo "=== Le port 443 est-il ouvert ? ==="
          for ip in $(dig +short myfocal.online A); do
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$ip/443" 2>/dev/null \
              && echo "  $ip:443 ouvert" || echo "  $ip:443 INJOIGNABLE"
          done

          echo "=== Requete avec identification de navigateur ==="
          curl -s -o /tmp/n -A "$UA" --max-time 45 \
            -w '  accueil -> HTTP %{http_code} en %{time_total}s\n' https://myfocal.online/
          echo "  taille recue : $(wc -c < /tmp/n 2>/dev/null || echo 0) octets"
          grep -oE '<title>[^<]*' /tmp/n 2>/dev/null | sed 's/<title>/  titre : /'

          echo "=== Meme requete en curl nu (pour comparer) ==="
          curl -s -o /dev/null --max-time 45 -w '  accueil -> HTTP %{http_code} en %{time_total}s\n' https://myfocal.online/

          echo "=== Et l'espace ? ==="
          curl -s -o /tmp/e -A "$UA" --max-time 45 \
            -w '  installation.php -> HTTP %{http_code}\n' https://myfocal.online/espace/installation.php
          grep -oE '<h1[^>]*>[^<]*|Base de donn[^<]*|Configuration absente' /tmp/e 2>/dev/null | head -2 | sed 's/^/     /'
          exit 0
