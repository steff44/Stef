name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: La migration passe-t-elle sur MySQL
        shell: bash
        run: |
          set +e
          B=https://myfocal.online

          echo "=== 1er appel : declenche la migration (ALTER TABLE) ==="
          curl -s --max-time 30 -o /tmp/a -w '  installation.php -> HTTP %{http_code}\n' "$B/espace/installation.php"
          grep -oE '<h1[^>]*>[^<]*' /tmp/a | sed 's/<h1[^>]*>/     titre : /' | head -1

          echo "=== 2e appel : doit repondre pareil, via le temoin ==="
          curl -s --max-time 30 -o /tmp/b -w '  installation.php -> HTTP %{http_code}\n' "$B/espace/installation.php"
          grep -oE '<h1[^>]*>[^<]*' /tmp/b | sed 's/<h1[^>]*>/     titre : /' | head -1

          echo "  --- VERDICT MIGRATION ---"
          if grep -qE 'Base de donn|Configuration absente|Fatal|Erreur' /tmp/b; then
            echo "     >>> ECHEC : la base renvoie une erreur"
            head -c 500 /tmp/b
          elif grep -qE 'd&eacute;j&agrave; install|déjà install' /tmp/b; then
            echo "     >>> OK : la base repond, aucune erreur — les colonnes sont en place"
          else
            echo "     >>> etat inattendu"; head -c 400 /tmp/b
          fi

          echo "=== Les pages de l'espace repondent-elles ? ==="
          for u in /espace/connexion.php /espace/index.php /espace/adherents.php; do
            printf "  %-28s -> %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B$u")"
          done

          echo "=== Le site public est-il intact ? ==="
          for u in / /membres.html /contact.html; do
            printf "  %-28s -> %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B$u")"
          done

          echo "=== Protections toujours en place ==="
          for u in /espace/inc/config.local.php /espace/inc/migration.php /espace/photos/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$B$u")
            case "$c" in 403|404) v="OK";; *) v="!!! A VERIFIER !!!";; esac
            printf "  %-34s -> %s  %s\n" "$u" "$c" "$v"
          done
          exit 0
