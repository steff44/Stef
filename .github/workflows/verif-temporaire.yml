name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Etat du site et de l'espace
        shell: bash
        run: |
          set +e
          B=https://myfocal.online

          echo "=== Pages publiques ==="
          for u in / /index.html /galerie.html /evenements.html /membres.html /contact.html; do
            printf "  %-24s -> %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$B$u")"
          done

          echo "=== L'ancienne page connexion.html redirige-t-elle ? ==="
          printf "  code direct        : %s\n" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$B/connexion.html")"
          curl -s --max-time 20 "$B/connexion.html" | grep -oE 'http-equiv="refresh"[^>]*|espace/connexion.php' | head -2 | sed 's/^/  /'

          echo "=== Le menu pointe-t-il sur l'espace ? ==="
          n=$(curl -s --max-time 20 "$B/" | grep -c 'espace/connexion.php')
          echo "  liens vers espace/connexion.php sur l'accueil : $n"

          echo "=== ETAPE DE MISE EN SERVICE ==="
          curl -s --max-time 20 -o /tmp/i -w '  installation.php -> %{http_code}\n' "$B/espace/installation.php"
          if   grep -q "Configuration absente"        /tmp/i; then echo "  >>> ETAPE 1-2 A FAIRE : config.local.php n'existe pas encore"
          elif grep -q "Base de donn"                 /tmp/i; then echo "  >>> ETAPE 2 A CORRIGER : config.local.php existe mais les identifiants MySQL sont refuses"
          elif grep -q "Installation deja faite\|déjà installé" /tmp/i; then echo "  >>> DEJA INSTALLE : un compte existe, l'espace est operationnel"
          elif grep -q "name=\"identifiant\""         /tmp/i; then echo "  >>> PRET A INSTALLER : la base repond, le formulaire d'installation s'affiche"
          else echo "  >>> etat non reconnu"; fi

          echo "=== Protections (doivent rester 403) ==="
          for u in /espace/inc/config.local.php /espace/inc/auth.php /espace/photos/ /espace/fichiers/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$B$u")
            case "$c" in 403|404) v="OK";; *) v="!!! A VERIFIER !!!";; esac
            printf "  %-34s -> %s  %s\n" "$u" "$c" "$v"
          done
          exit 0
