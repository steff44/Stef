name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Les 200 de focalclub.fr/.eu sont-ils de vraies fuites
        shell: bash
        run: |
          set +e
          for d in focalclub.fr focalclub.eu; do
            echo "=================== $d"
            for u in /espace/inc/auth.php /espace/inc/config.example.php /espace/galerie.php /nimporte-quoi-inexistant-12345; do
              curl -s --max-time 20 -o /tmp/c -w '' "https://$d$u"
              taille=$(wc -c < /tmp/c)
              type=$(curl -s --max-time 20 -o /dev/null -w '%{content_type}' "https://$d$u")
              # signatures d'une vraie fuite de code source PHP
              fuite=""
              grep -q "declare(strict_types" /tmp/c && fuite="CODE PHP"
              grep -q "MOT_DE_PASSE_DE_LA_BASE" /tmp/c && fuite="CONFIG"
              grep -q "password_verify\|jeton_csrf" /tmp/c && fuite="CODE PHP"
              printf "  %-38s %7s o  %-28s %s\n" "$u" "$taille" "$type" "${fuite:-pas de code source}"
            done
            echo "  --- signature de la page renvoyee ---"
            curl -s --max-time 20 "https://$d/espace/inc/auth.php" | grep -oE '<title>[^<]*|Hostinger|404|introuvable' | head -2 | sed 's/^/     /'
          done

          echo "=================== myfocal.online : confirmation finale"
          for u in /espace/inc/auth.php /espace/inc/config.example.php; do
            printf "  %-38s -> %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://myfocal.online$u")"
          done
          echo "  --- la page de connexion s'affiche-t-elle vraiment ? ---"
          curl -s --max-time 20 "https://myfocal.online/espace/connexion.php" | grep -oE '<title>[^<]*|Configuration absente|Base de donnees injoignable|Identifiant' | head -4 | sed 's/^/     /'
          exit 0
