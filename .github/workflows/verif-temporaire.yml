name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Le suffixe de version est-il en place
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          B=https://myfocal.online

          echo "=== Page de connexion (PHP) : version automatique ? ==="
          L=$(curl -s -A "$UA" --max-time 40 "$B/espace/connexion.php" | grep -oE '<link[^>]*style\.css[^>]*>')
          echo "  $L"
          echo "$L" | grep -qE 'style\.css\?v=[0-9]{6,}' \
            && echo "  OK : version derivee de la date du fichier" \
            || echo "  ECHEC : pas de version automatique"

          echo "=== Accueil (HTML statique) ==="
          L=$(curl -s -A "$UA" --max-time 40 "$B/index.html" | grep -oE '<link[^>]*style\.css[^>]*>')
          echo "  $L"
          echo "$L" | grep -q 'style\.css?v=' && echo "  OK : version presente" || echo "  ECHEC"

          echo "=== L'adresse versionnee sert-elle bien le bon fichier ? ==="
          V=$(curl -s -A "$UA" --max-time 40 "$B/espace/connexion.php" \
                | grep -oE 'style\.css\?v=[0-9]+' | head -1 | cut -d= -f2)
          curl -s -A "$UA" --max-time 40 -o /tmp/c "$B/css/style.css?v=$V"
          echo "  taille : $(wc -c < /tmp/c) octets"
          grep -qF "  border: 1px solid var(--border);" /tmp/c \
            && echo "  OK : le quadrillage est bien dans le fichier servi" \
            || echo "  ECHEC : quadrillage absent"

          echo "=== Les pages repondent-elles toujours ? ==="
          for u in / /espace/connexion.php /espace/adherents.php; do
            printf "  %-28s -> %s\n" "$u" "$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 40 "$B$u")"
          done
          exit 0
