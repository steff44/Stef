name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: infos-club.php et coordonnees en ligne
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          B=https://myfocal.online

          echo "=== infos-club.php ==="
          curl -s -A "$UA" --max-time 40 -o /tmp/i -w '  HTTP %{http_code}\n' "$B/infos-club.php"
          cat /tmp/i
          echo

          echo "--- verification des cles attendues ---"
          for paire in 'nom_lieu:Foyer des Vignes' 'adresse_rue:17 rue Michelet' 'adresse_code_postal:44420' 'adresse_ville:La Turballe' 'telephone:06 17 11 77 65' 'email:cooky44.sl@gmail.com'; do
            cle="${paire%%:*}"
            attendu="${paire#*:}"
            if grep -qF "\"$cle\":\"$attendu\"" /tmp/i; then
              echo "  OK    $cle"
            else
              echo "  ABSENT ou FAUX : $cle (attendu: $attendu)"
            fi
          done

          echo "=== Page Contact : nouvelle adresse presente (repli statique) ==="
          curl -s -A "$UA" --max-time 40 "$B/contact.html" | grep -oE '17 rue Michelet[^<]*|Foyer des Vignes' | sort -u | sed 's/^/  /'

          echo "=== parametres.php protegee ? ==="
          curl -s -A "$UA" -o /dev/null -w '  sans connexion -> %{http_code} vers ' --max-time 40 "$B/espace/parametres.php"
          curl -s -A "$UA" -o /dev/null -w '%{redirect_url}\n' --max-time 40 "$B/espace/parametres.php"

          echo "=== Aucune fuite de configuration ==="
          for u in /espace/inc/config.local.php /espace/inc/migration.php; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 40 "$B$u")
            case "$c" in
              403|404) v="OK" ;;
              *) v="A VERIFIER" ;;
            esac
            printf "  %-34s -> %s  %s\n" "$u" "$c" "$v"
          done

          exit 0
