name: Vérification temporaire de l'espace
on:
  push:
    branches: ["claude/verif-espace"]
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: L'installation est-elle terminee
        shell: bash
        run: |
          set +e
          B=https://myfocal.online
          curl -s --max-time 25 -o /tmp/i -w '  installation.php -> HTTP %{http_code}\n' "$B/espace/installation.php"
          echo "  --- titre affiche ---"
          grep -oE '<h1[^>]*>[^<]*' /tmp/i | sed 's/<h1[^>]*>/     /' | head -2
          echo "  --- VERDICT ---"
          if   grep -qE 'd&eacute;j&agrave; install|déjà install|Installation d&eacute;j|Installation déj' /tmp/i; then
            echo "     >>> COMPTE CREE : l'installation est terminee, la page est verrouillee (comportement normal)"
          elif grep -q 'name="mot_de_passe"' /tmp/i && grep -q 'name="confirmation"' /tmp/i; then
            echo "     >>> PAS ENCORE DE COMPTE : le formulaire d'installation est toujours ouvert"
          else
            echo "     >>> etat non reconnu"
          fi
          echo "  --- la page de connexion fonctionne-t-elle ? ---"
          curl -s --max-time 25 -o /dev/null -w '     connexion.php -> HTTP %{http_code}\n' "$B/espace/connexion.php"
          echo "  --- une page reservee redirige-t-elle bien ? ---"
          curl -s --max-time 25 -o /dev/null -w '     adherents.php -> HTTP %{http_code} vers %{redirect_url}\n' "$B/espace/adherents.php"
          exit 0
