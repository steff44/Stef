name: Diagnostic favicon (temporaire)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: En-têtes favicon.ico (focalclub.fr)
        run: |
          echo "=== focalclub.fr/favicon.ico ==="
          curl -sSI --max-time 15 "https://focalclub.fr/favicon.ico?diag=$(date +%s)" || echo "(échec/délai dépassé)"
          echo
          echo "=== myfocal.online/favicon.ico ==="
          curl -sSI --max-time 15 "https://myfocal.online/favicon.ico?diag=$(date +%s)" || echo "(échec/délai dépassé)"
          echo
          echo "=== focalclub.fr/index.html (extrait <head>) ==="
          curl -sS --max-time 15 "https://focalclub.fr/index.html?diag=$(date +%s)" | grep -i -A2 -B2 "icon\|style.css" || echo "(échec/délai dépassé)"
