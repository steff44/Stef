name: Inspection temporaire (focalclub.fr)

on:
  workflow_dispatch:

jobs:
  fetch-image:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger la photo hero (Unsplash) et l'encoder
        run: |
          curl -sL -o hero.jpg "https://images.unsplash.com/photo-1611842642932-fbec0d723eb2?auto=format&fit=crop&w=1920&q=70"
          ls -la hero.jpg
          file hero.jpg
          echo "===HERO_JPG_BASE64_START==="
          base64 -w 0 hero.jpg
          echo
          echo "===HERO_JPG_BASE64_END==="
