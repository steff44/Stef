name: Inspection temporaire (focalclub.fr)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspection SSH en lecture seule
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USERNAME: ${{ secrets.HOSTINGER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$PORT" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$USERNAME@$HOST" '
            echo "== ls assets (recursif) =="
            find ~/domains/focalclub.fr/public_html/assets -maxdepth 3 -type f
            echo
            echo "== index.html =="
            cat ~/domains/focalclub.fr/public_html/index.html
          '
