name: Diagnostic temporaire - formulaire mot de passe oublié

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la page en direct (cache-busté)
        run: |
          {
            URL="https://focalclub.fr/espace/mot-de-passe-oublie.php?diagbust=$(date +%s)"
            echo "=== En-têtes ==="
            curl -sS -D - -o /tmp/page.html "$URL" -H "Cache-Control: no-cache"
            echo ""
            echo "=== Présence des champs dans le HTML servi ==="
            if grep -q 'name="ref_interne"' /tmp/page.html; then
              echo "OK : le champ piège renommé (ref_interne) est bien présent dans le HTML servi."
            else
              echo "PROBLEME : ref_interne absent du HTML servi !"
            fi
            if grep -q 'name="site_web"' /tmp/page.html; then
              echo "PROBLEME : l'ancien champ (site_web) est encore présent dans le HTML servi !"
            else
              echo "OK : l'ancien champ (site_web) n'apparaît plus."
            fi
            echo ""
            echo "=== Jeton CSRF trouvé (1re requête) ==="
            grep -o 'name="csrf" value="[a-f0-9]*"' /tmp/page.html || echo "Aucun jeton CSRF trouvé."
            echo ""
            echo "=== Cookie de session reçu (1re requête) ==="
            curl -sS -D /tmp/h2.txt -o /tmp/page2.html "$URL&second=1" -H "Cache-Control: no-cache"
            cat /tmp/h2.txt
            echo ""
            echo "=== Jeton CSRF trouvé (2e requête, doit différer du 1er) ==="
            grep -o 'name="csrf" value="[a-f0-9]*"' /tmp/page2.html || echo "Aucun jeton CSRF trouvé (2e requête)."
            echo ""
            echo "=== Contenu complet de la page (pour inspection) ==="
            cat /tmp/page.html
          } > /tmp/resultat-diag.txt 2>&1
          cat /tmp/resultat-diag.txt

      - name: Publier le résultat comme check run (artefacts inaccessibles depuis le sandbox)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENU=$(cat /tmp/resultat-diag.txt | head -c 60000)
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/check-runs \
            -d "$(jq -n --arg sha "${{ github.sha }}" --arg text "$CONTENU" \
              '{name: "resultat-diag", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: "Résultat diagnostic", summary: "voir texte", text: $text}}')"
