name: Diagnostic temporaire — Galerie Drive

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Combien de photos le site renvoie-t-il (cache ignoré) ?
        run: |
          curl -s --max-time 30 'https://myfocal.online/infos-galerie-drive.php?forcer=1' -o /tmp/r.json
          echo "Nombre de photos : $(python3 -c 'import json;print(len(json.load(open("/tmp/r.json"))))')"
          echo "--- 5 premieres ---"
          python3 -c 'import json;[print("-",p["titre"]) for p in json.load(open("/tmp/r.json"))[:5]]'
